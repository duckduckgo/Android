plugins {
    id 'com.android.library'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

dependencies {
	implementation project(":anrs-api")
	implementation project(':codegen-annotations')
	implementation project(':common-utils')
	implementation project(":data-store-api")
	implementation project(':di')
	implementation project(':feature-toggles-api')
	implementation project(':statistics-api')
	implementation("com.frybits.harmony:harmony:_") {
		because 'multi-process shared preferences'
	}
	implementation 'com.frybits.harmony:harmony-crypto:_'
	implementation "com.squareup.logcat:logcat:_"
	implementation "org.jetbrains.kotlin:kotlin-test:_"
	implementation AndroidX.core.ktx
	implementation AndroidX.room.runtime
	implementation AndroidX.room.rxJava2
	implementation AndroidX.security.crypto
	implementation KotlinX.coroutines.android

	testImplementation project(':common-test')
	testImplementation project(':feature-toggles-test')
	testImplementation "org.mockito.kotlin:mockito-kotlin:_"
	testImplementation AndroidX.test.ext.junit
	testImplementation CashApp.turbine
	testImplementation(KotlinX.coroutines.test) {
        // https://github.com/Kotlin/kotlinx.coroutines/issues/2023
        // conflicts with mockito due to direct inclusion of byte buddy
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
    }
	testImplementation Testing.junit4
	testImplementation Testing.robolectric

	ksp project(':codegen-ksp')
	ksp AndroidX.room.compiler
}

android {
    namespace "com.duckduckgo.datastore.impl"
    lint {
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

