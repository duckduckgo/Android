plugins {
    id 'com.android.library'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

android {
    namespace 'com.duckduckgo.browser.ui'
}

android {
    lintOptions {
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation project(path: ':app-build-config-api')
    implementation project(':browser-api')
    implementation project(':browser-mode-api')
    implementation project(path: ':codegen-annotations')
    implementation project(path: ':common-utils')
    implementation project(':design-system')
    implementation project(path: ':di')
    implementation project(':duckchat-api')
    implementation project(':internal-features-api')
    implementation project(':navigation-api')
    implementation project(':new-tab-page-api')
    implementation project(':settings-api')
    implementation project(':statistics-api')
    implementation "androidx.core:core-ktx:_"
    implementation "androidx.datastore:datastore-preferences:_"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:_"
    implementation "com.airbnb.android:lottie:_"
    implementation "com.github.bumptech.glide:glide:_"
    implementation AndroidX.appCompat
    implementation AndroidX.constraintLayout
    implementation AndroidX.core.splashscreen
    implementation AndroidX.lifecycle.viewModelKtx
    implementation AndroidX.recyclerView
    implementation Google.android.material
    implementation Testing.junit4

    testImplementation project(path: ':common-test')
    testImplementation project(':feature-toggles-test')
    testImplementation 'app.cash.turbine:turbine:_'
    testImplementation "org.mockito.kotlin:mockito-kotlin:_"
    testImplementation AndroidX.archCore.testing
    testImplementation AndroidX.test.ext.junit
    testImplementation Testing.robolectric

    ksp project(':codegen-ksp')
}
