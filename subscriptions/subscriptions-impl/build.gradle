plugins {
    id 'com.android.library'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

android {
    namespace 'com.duckduckgo.subscriptions.impl'

    lintOptions {
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
}

dependencies {
    implementation project(path: ':app-build-config-api')
    implementation project(':attributed-metrics-api')
    implementation project(path: ':browser-api')
    implementation project(path: ':browser-mode-api')
    implementation project(path: ':codegen-annotations')
    implementation project(path: ':common-utils')
    implementation project(':content-scope-scripts-api')
    implementation project(path: ':cookies-api')
    implementation project(':data-store-api')
    implementation project(path: ':design-system')
    implementation project(path: ':di')
    implementation project(path: ':downloads-api')
    implementation project(':duckchat-api')
    implementation project(path: ':feedback-api')
    implementation project(path: ':internal-features-api')
    implementation project(path: ':js-messaging-api')
    implementation project(path: ':navigation-api')
    implementation project(path: ':network-protection-api')
    implementation project(':onboarding-api')
    implementation project(':pir-api')
    implementation(project(':privacy-config-api')) {
        because 'remote feature flag'
    }
    implementation project(':privacy-dashboard-api')
    implementation(project(':remote-messaging-api')) {
        because 'remote feature flag'
    }
    implementation project(path: ':settings-api')
    implementation project(path: ':statistics-api')
    implementation project(path: ':subscriptions-api')
    implementation project(':survey-api')
    implementation project(path: ':user-agent-api')
    implementation project(':verified-installation-api')
    implementation project(':vpn-api')
    implementation "com.airbnb.android:lottie:_"
    implementation "com.android.billingclient:billing:_"
    implementation "com.android.billingclient:billing-ktx:_"
    implementation "com.squareup.logcat:logcat:_"
    implementation "io.jsonwebtoken:jjwt-api:_"
    implementation AndroidX.appCompat
    implementation AndroidX.constraintLayout
    implementation AndroidX.core.ktx
    implementation AndroidX.fragment.ktx
    implementation AndroidX.lifecycle.runtime.ktx
    implementation AndroidX.lifecycle.viewModelKtx
    implementation AndroidX.security.crypto
    implementation AndroidX.work.runtimeKtx
    implementation Google.android.material
    implementation KotlinX.coroutines.core
    implementation Square.okHttp3.okHttp
    implementation Square.retrofit2.converter.moshi

    runtimeOnly "io.jsonwebtoken:jjwt-impl:_"
    runtimeOnly("io.jsonwebtoken:jjwt-orgjson:_") {
        exclude(group: 'org.json', module: 'json') // provided by Android natively
    }

    testImplementation project(path: ':common-test')
    testImplementation project(path: ':data-store-test')
    testImplementation project(':feature-toggles-test')
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:_"
    testImplementation "androidx.test:runner:_"
    testImplementation 'app.cash.turbine:turbine:_'
    testImplementation 'junit:junit:4.13.1'
    testImplementation "org.mockito.kotlin:mockito-kotlin:_"
    testImplementation AndroidX.archCore.testing
    testImplementation AndroidX.core
    testImplementation AndroidX.test.ext.junit
    testImplementation AndroidX.work.testing
    testImplementation (KotlinX.coroutines.test) {
        // https://github.com/Kotlin/kotlinx.coroutines/issues/2023
        // conflicts with mockito due to direct inclusion of byte buddy
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
    }
    testImplementation Testing.junit4
    testImplementation Testing.robolectric

    ksp project(':codegen-ksp')
}

android {
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    namespace 'com.duckduckgo.subscriptions.impl'
}
