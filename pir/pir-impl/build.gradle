plugins {
    id 'com.android.library'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

dependencies {
    implementation project(':browser-api')
    implementation project(':codegen-annotations')
    implementation project(':common-utils')
    implementation project(':data-store-api')
    implementation project(':design-system')
    implementation project(':di')
    implementation project(':js-messaging-api')
    implementation project(':macos-api')
    implementation project(':navigation-api')
    implementation project(':network-protection-api')
    implementation project(":pir-api")
    implementation project(':remote-messaging-api')
    implementation project(':settings-api')
    implementation project(':sqlcipher-loader-api')
    implementation project(':statistics-api')
    implementation project(':subscriptions-api')
    implementation project(':tracker-detection-api')
    implementation project(':user-agent-api')
    implementation project(':windows-api')
    implementation "androidx.work:work-multiprocess:_"
    implementation "com.squareup.logcat:logcat:_"
    implementation "com.squareup.moshi:moshi-adapters:_"
    implementation "com.squareup.moshi:moshi-kotlin:_"
    implementation "net.zetetic:sqlcipher-android:_"
    implementation AndroidX.appCompat
    implementation AndroidX.core.ktx
    implementation AndroidX.room.runtime
    implementation AndroidX.security.crypto
    implementation AndroidX.webkit
    implementation AndroidX.work.runtimeKtx
    implementation Google.android.material
    implementation KotlinX.coroutines.android
    implementation Square.moshi
    implementation Square.retrofit2.converter.moshi

    testImplementation project(path: ':common-test')
    testImplementation project(path: ':feature-toggles-test')
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:_"
    testImplementation "org.mockito.kotlin:mockito-kotlin:_"
    testImplementation AndroidX.room.testing
    testImplementation AndroidX.test.ext.junit
    testImplementation AndroidX.work.testing
    testImplementation CashApp.turbine
    testImplementation(KotlinX.coroutines.test) {
        // We exclude kotlinx-coroutines-debug because it bundles ByteBuddy, which conflicts with Mockito.
        // https://github.com/Kotlin/kotlinx.coroutines/issues/2023
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
    }
    testImplementation Testing.junit4
    testImplementation Testing.robolectric

    // We don't use Mockito in instrumentation tests; we use real implementations or fakes instead.
    androidTestImplementation project(path: ':common-test')
    androidTestImplementation project(path: ':feature-toggles-test')
    androidTestImplementation AndroidX.test.ext.junit
    androidTestImplementation AndroidX.test.runner
    androidTestImplementation(KotlinX.coroutines.test) {
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
    }
    androidTestImplementation Testing.junit4

    ksp project(':codegen-ksp')
    ksp AndroidX.room.compiler
}

android {
    namespace "com.duckduckgo.pir.impl"
    sourceSets {
        test.assets.srcDirs += files("$projectDir/schemas")
    }
    lint {
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
    room {
        schemaDirectory("$projectDir/schemas")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.register('androidTestsBuild') {
    dependsOn 'assembleDebugAndroidTest'
}
