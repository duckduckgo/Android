plugins {
    id 'com.android.application'

    id 'com.google.devtools.ksp'
    id 'dev.zacsweers.metro'
    id 'androidx.room'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
}
apply from: '../versioning.gradle'
apply from: "$rootDir/code-formatting.gradle"

ext {
    USE_ORCHESTRATOR = project.hasProperty('orchestrator') ? project.property('orchestrator') : false
    CI_HOME_DIR = "${System.getenv('HOME')}/jenkins_static/com.duckduckgo.mobile.android"
}

android {
    defaultConfig {
        applicationId "com.duckduckgo.mobile.android"

        minSdk min_sdk
        targetSdk target_sdk
        compileSdk compile_sdk
        versionCode buildVersionCode()
        versionName buildVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        sourceSets {
            androidTest.assets.srcDirs += files("$projectDir/schemas")
            main {
                java {
                    resources {
                        srcDirs += files("$projectDir/../node_modules/@duckduckgo/autofill/dist/".toString())
                        srcDirs += files("$projectDir/../submodules/".toString())
                    }
                }
                assets {
                    srcDirs += files("$projectDir/../node_modules/@duckduckgo/privacy-dashboard/build/app".toString())
                    srcDirs += files("$projectDir/../node_modules/@duckduckgo/content-scope-scripts/build/android/pages".toString())
                }
            }
        }

        if (project.hasProperty('perf-test')) {
            buildConfigField "boolean", "IS_PERFORMANCE_TEST", "true"
        } else {
            buildConfigField "boolean", "IS_PERFORMANCE_TEST", "false"
        }
        if (project.hasProperty('force-default-variant')) {
            buildConfigField "boolean", "FORCE_DEFAULT_VARIANT", "true"
        } else {
            buildConfigField "boolean", "FORCE_DEFAULT_VARIANT", "false"
        }
        if (project.hasProperty('skip-onboarding')) {
            buildConfigField "boolean", "CAN_SKIP_ONBOARDING", "true"
        } else {
            buildConfigField "boolean", "CAN_SKIP_ONBOARDING", "false"
        }
        if (project.hasProperty('build-date-time')) {
            buildConfigField "long", "BUILD_DATE_MILLIS", "${System.currentTimeMillis()}"
        } else {
            buildConfigField "long", "BUILD_DATE_MILLIS", "0"
        }

        namespace 'com.duckduckgo.app.browser'
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        jvmToolchain(21)
    }
    ksp {
        arg("room.generateKotlin", "true")
    }
    signingConfigs {
        debug {
            def localPropertiesFile = project.rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                def properties = new Properties()
                localPropertiesFile.withInputStream { properties.load(it) }

                if (properties.getProperty("useCustomDebugCert")?.toBoolean()) {
                    storeFile = file(properties['customDebugCertPath']?.toString())
                    storePassword = properties['customDebugCertStorePassword']?.toString()
                    keyAlias = properties['customDebugCertAlias']?.toString()
                    keyPassword properties['customDebugCertKeyPassword']?.toString()
                }
            } else {
                def propertiesPath = "${CI_HOME_DIR}/ddg_android_debug_build.properties"
                def propertiesFile = new File(propertiesPath)
                if (propertiesFile.exists()) {
                    def props = new Properties()
                    propertiesFile.withInputStream { props.load(it) }
                    storeFile = file("${CI_HOME_DIR}/${props['key.store']}")
                    storePassword = props['key.store.password']
                    keyAlias = props['key.alias']
                    keyPassword = props['key.alias.password']
                }
            }
        }
        release {
            def propertiesPath = "${CI_HOME_DIR}/ddg_android_build.properties"
            def propertiesFile = new File(propertiesPath)
            if (propertiesFile.exists()) {
                def props = new Properties()
                propertiesFile.withInputStream { props.load(it) }
                storeFile = file("${CI_HOME_DIR}/${props['key.store']}")
                storePassword = props['key.store.password']
                keyAlias = props['key.alias']
                keyPassword = props['key.alias.password']
            }
        }
        upload {
            def propertiesPath = "${CI_HOME_DIR}/ddg_android_build_upload.properties"
            def propertiesFile = new File(propertiesPath)
            if (propertiesFile.exists()) {
                def props = new Properties()
                propertiesFile.withInputStream { props.load(it) }
                storeFile = file("${CI_HOME_DIR}/${props['key.store']}")
                storePassword = props['key.store.password']
                keyAlias = props['key.alias']
                keyPassword = props['key.alias.password']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            pseudoLocalesEnabled false
            manifestPlaceholders = [
                    appIcon     : "@mipmap/ic_launcher_blue",
                    appIconRound: "@mipmap/ic_launcher_blue_round"
            ]
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon     : "@mipmap/ic_launcher_red",
                    appIconRound: "@mipmap/ic_launcher_red_round"
            ]

            if (project.hasProperty('useUploadSigning')) {
                signingConfig = signingConfigs.upload
            } else if (isValidSigningConfig(signingConfigs.release)) {
                signingConfig = signingConfigs.release
            } else {
                println "Signing properties not found, release artifacts will not be signed."
                signingConfig = null
            }
        }
    }
    flavorDimensions "store"
    productFlavors {
        internal {
            dimension "store"
        }
        fdroid {
            dimension "store"
        }
        play {
            dimension "store"
        }
    }
    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("fdroid") && variant.buildType.name == "debug") {
            // We don't need fdroidDebug build type
            setIgnore(true)
        }
    }
    lint {
        abortOnError true
        ignoreTestSources false
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
    testOptions {
        unitTests.returnDefaultValues = true
        animationsDisabled = true
        unitTests.all {
            // TieredStopAtLevel=1 on its own shrinks the code cache to 48 MB, and Robolectric sandboxes can fill that.
            jvmArgs '-XX:+TieredCompilation', '-XX:TieredStopAtLevel=1', '-XX:ReservedCodeCacheSize=256m'
            maxHeapSize = "2g"
            forkEvery = 100
        }
    }

    buildFeatures {
        compose true
    }

    room {
        schemaDirectory("$projectDir/schemas")
    }

    packagingOptions {
        jniLibs {
            // this is required so the handler exists as a real file on disk
            useLegacyPackaging = true
        }
    }
}

baselineProfile {
    automaticGenerationDuringBuild = false
    saveInSrc = true
    mergeIntoMain = true
}

base {
    archivesName = "duckduckgo-${buildVersionName()}"
}

if (!rootProject.ext.proprietaryFontAvailable && !rootProject.ext.proprietaryFontOptOut) {
    def protectedVariants = ['PlayRelease', 'InternalRelease']

    protectedVariants.each { variantName ->
        tasks.register("validateDuckSansFont${variantName}") {
            doLast {
                throw new GradleException(
                    "DUCKSANS: ${variantName} builds require the proprietary DuckSans font.\n" +
                    "Set DUCKSANS_PACKAGE_AUTH_USER and DUCKSANS_PACKAGE_AUTH_TOKEN environment variables,\n" +
                    "or ducksans.gpr.user and ducksans.gpr.key in gradle.properties,\n" +
                    "or pass -PuseProprietaryFont=false to use placeholder fallback fonts.\n" +
                    "Example: ./gradlew assembleInternalDebug -PuseProprietaryFont=false"
                )
            }
        }
    }

    tasks.configureEach { task ->
        protectedVariants.each { variantName ->
            if (task.name == "assemble${variantName}" || task.name == "bundle${variantName}") {
                task.dependsOn("validateDuckSansFont${variantName}")
            }
        }
    }
}

static def isValidSigningConfig(signingConfig) {
    return signingConfig != null &&
            signingConfig.storeFile?.exists() &&
            signingConfig.storePassword &&
            signingConfig.keyAlias &&
            signingConfig.keyPassword
}

fulladleModuleConfig {
    variant.set("playDebug")
}

def privacyTestDefaults = { config ->
    config.async.set(false)
    config.useOrchestrator.set(true)
    config.environmentVariables.set(["clearPackageData": "true"])
    config.devices.set([["model": "MediumPhone.arm", "version": "34"]])
    config.localResultsDir.set("fladleResults")
    config.flakyTestAttempts.set(1)
    // Emit the full merged JUnit report so it retains every execution,
    // including the failed attempt + passed rerun of a flaky test.
    config.fullJunitResult.set(true)
    config.testShards.set(1)
}

fladle {
    configs {
        privacyTests {
            privacyTestDefaults(it)
            testTargets.set(["annotation com.duckduckgo.espresso.PrivacyTest"])
        }
        internalPrivacyTests {
            privacyTestDefaults(it)
            testTargets.set(["annotation com.duckduckgo.espresso.InternalPrivacyTest"])
            debugApk.set(project.layout.buildDirectory.file("outputs/apk/internal/debug/duckduckgo-${buildVersionName()}-internal-debug.apk").map { it.asFile.absolutePath })
            instrumentationApk.set(project.layout.buildDirectory.file("outputs/apk/androidTest/internal/debug/duckduckgo-${buildVersionName()}-internal-debug-androidTest.apk").map { it.asFile.absolutePath })
            additionalTestApks.set([])
        }
    }
}

