plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'com.squareup.anvil'
    id 'com.google.devtools.ksp'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

android {
    namespace 'com.duckduckgo.credentialexchange.impl'
    anvil {
        generateDaggerFactories = true
    }
    lint {
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
}

dependencies {
    ksp project(':anvil-ksp')
    implementation project(path: ':credential-exchange-api')
    implementation project(path: ':di')
    implementation project(path: ':feature-toggles-api')
    implementation project(path: ':common-utils')
    implementation project(path: ':anvil-annotations')

    implementation Google.dagger
    implementation KotlinX.coroutines.core
    implementation Square.logcat
    implementation "com.squareup.moshi:moshi-kotlin:_"
    implementation "androidx.appcompat:appcompat:_"

    implementation "androidx.credentials.providerevents:providerevents:_"
    implementation "androidx.credentials.providerevents:providerevents-play-services:_"

    testImplementation project(path: ':common-test')
    testImplementation project(path: ':feature-toggles-test')
    testImplementation Testing.junit4
    testImplementation "org.mockito.kotlin:mockito-kotlin:_"
    testImplementation (KotlinX.coroutines.test) {
        exclude group: "org.jetbrains.kotlinx", module: "kotlinx-coroutines-debug"
    }
}
