plugins {
    id 'com.android.library'
    id 'com.squareup.anvil'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

dependencies {
    ksp project(':anvil-ksp')
    implementation project(':anvil-annotations')
    implementation project(':di')
    ksp AndroidX.room.compiler

    api project(':tracker-detection-api')
    // TdsTracker's primary key is a Domain
    api project(':browser-api')
    implementation project(':data-store-api')

    implementation AndroidX.room.runtime
    implementation Google.dagger
    implementation Square.moshi

    testImplementation Testing.junit4
    testImplementation Testing.robolectric
    testImplementation AndroidX.test.ext.junit
    testImplementation AndroidX.room.testing
    testImplementation AndroidX.archCore.testing
    testImplementation project(':common-test')

    coreLibraryDesugaring Android.tools.desugarJdkLibs
}

android {
    sourceSets {
        test.assets.srcDirs += files("$projectDir/schemas")
    }
    namespace 'com.duckduckgo.tracker.detection.impl'
    anvil {
        generateDaggerFactories = true // default is false
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
    }
    room {
        schemaDirectory("$projectDir/schemas")
    }
}
