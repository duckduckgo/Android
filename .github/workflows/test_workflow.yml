name: Test - Workflow for Testing

on:
  push:
    branches:
      - feature/cris/segment-skip-e2e-tests
  workflow_dispatch:
    inputs:
      commit:
        description: 'Specific commit SHA to checkout (optional, defaults to latest)'
        required: false
        type: string
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation_tests:
    runs-on: ubuntu-latest
    name: End-to-End tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assemble APKs
        id: assemble
        uses: ./.github/actions/checkout-and-assemble
        with:
          commit: ${{ inputs.commit }}
          release_properties: ${{ secrets.FAKE_RELEASE_PROPERTIES }}
          release_key: ${{ secrets.FAKE_RELEASE_KEY }}
          gradle_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle_flags: '-Pautofill-disable-auth-requirement -Pconfig_patches=.maestro/duckplayer/patches/ad_blocking_enabled_patch.json,.maestro/duckplayer/patches/duck_player_standalone_settings_patch.json,.maestro/segment_skip/remote_config_patches/segment_skip_enabled_patch.json'
          develocity_access_key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          ducksans_package_auth_user: ${{ secrets.DAXMOBILE_GITHUB_PACKAGES_AUTOMATION_USER }}
          ducksans_package_auth_token: ${{ secrets.DAXMOBILE_GITHUB_PACKAGES_AUTOMATION }}

      - name: Upload Internal Binary to Maestro
        id: maestro-upload-internal-binary
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: binary_internal_upload_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_file: ${{ steps.assemble.outputs.internal_apk_path }}
          maestro_api_level: 34
          maestro_include_tags: binaryUpload
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Internal Binary Upload

      - name: Upload Release Binary to Maestro
        id: maestro-upload-release-binary
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: binary_release_upload_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_file: ${{ steps.assemble.outputs.play_apk_path }}
          maestro_api_level: 34
          maestro_include_tags: binaryUpload
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Release Binary Upload

      - name: Autofill Web Flows
        id: maestro-autofill-web
        # Run regardless of earlier suite failures, but only if the release binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-release-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: autofill_secondary_functionality_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-release-binary.outputs.maestro_app_binary_id }}
          maestro_api_level: 34
          maestro_include_tags: autofillBackfillingUsername,autofillPasswordGeneration
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Autofill Web Flows

      - name: Run Duck Player Maestro Tests
        id: maestro-cloud-asana
        # Run regardless of earlier suite failures, but only if the internal binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-internal-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: duckPlayerTest_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-internal-binary.outputs.maestro_app_binary_id }}
          maestro_include_tags: duckplayer
          maestro_api_level: 34
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Duck Player

      - name: Segment Skip
        id: maestro-segment-skip
        # Run regardless of earlier suite failures, but only if the internal binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-internal-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: segmentSkip_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-internal-binary.outputs.maestro_app_binary_id }}
          maestro_include_tags: segmentSkip
          maestro_api_level: 34
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Segment Skip

      - name: Diagnose Segment Skip failure
        # Reports whether a live dependency, rather than the app, broke the Segment Skip suite.
        if: ${{ !cancelled() && steps.maestro-segment-skip.outcome == 'failure' }}
        env:
          # Must match the video and segment used in .maestro/segment_skip/segment_skip_live_player.yaml.
          VIDEO_ID: wHAT_JDwFOY
          SEGMENT_START: 48
          BASE_URL: https://protection.duckduckgo.com/api/protection/segmentSkip/v1/android
        run: |
          fetch() { curl -sS --compressed -o "$2" -w '%{http_code}' "$1" || echo 000; }

          status=$(fetch "$BASE_URL/revision" revision.json)
          if [ "$status" != 200 ]; then
            echo "::error title=Segment Skip::DATASET SERVICE FAILURE: revision endpoint returned HTTP $status"
            exit 0
          fi
          revision=$(jq -r '.revision' revision.json)

          status=$(fetch "$BASE_URL/hashPrefix?revision=$revision&format=binary&version=1" prefixes.bin)
          if [ "$status" != 200 ]; then
            echo "::error title=Segment Skip::DATASET SERVICE FAILURE: hashPrefix endpoint returned HTTP $status"
            exit 0
          fi
          # The app's binary store rejects any dataset file without this magic.
          if [ "$(head -c 4 prefixes.bin)" != SBPL ]; then
            echo "::error title=Segment Skip::DATASET FORMAT FAILURE: hashPrefix did not return the binary format the app expects"
            exit 0
          fi

          hash_prefix=$(printf '%s' "$VIDEO_ID" | sha256sum | cut -c1-4)
          status=$(fetch "$BASE_URL/matches?hashPrefix=$hash_prefix" matches.json)
          if [ "$status" != 200 ]; then
            echo "::error title=Segment Skip::SEGMENT LOOKUP SERVICE FAILURE: matches endpoint returned HTTP $status"
            exit 0
          fi
          has_segment=$(jq --arg id "$VIDEO_ID" --argjson start "$SEGMENT_START" '
            [.[] | select(.videoID == $id) | .segments[]?
              | select(.category == "sponsor" and .actionType == "skip"
                  and ((.segment[0] - $start) | fabs) <= 2
                  and (.segment[1] - .segment[0]) >= 30)]
            | length > 0' matches.json)
          if [ "$has_segment" != true ]; then
            echo "::error title=Segment Skip::MISSING SEGMENT DATA: $VIDEO_ID no longer has a sponsor segment starting near ${SEGMENT_START}s and lasting 30s or more"
            exit 0
          fi

          echo "::notice title=Segment Skip::Live services and segment data look fine; the failure is likely in the app or the YouTube player"

      - name: Android Design System
        id: maestro-ads
        # Run regardless of earlier suite failures, but only if the internal binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-internal-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: ads_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-internal-binary.outputs.maestro_app_binary_id }}
          maestro_include_tags: androidDesignSystemTest
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          maestro_api_level: 34
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Android Design System (Nightly)

      - name: Onboarding
        id: maestro-onboarding-non-release-blocking
        # Run regardless of earlier suite failures, but only if the internal binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-internal-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: onboardingNonReleaseBlockingTest_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-internal-binary.outputs.maestro_app_binary_id }}
          maestro_api_level: 34
          maestro_include_tags: onboardingNonReleaseBlockingTest
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Onboarding

      - name: SERP Flows
        id: maestro-serp-flows
        # Run regardless of earlier suite failures, but only if the internal binary uploaded.
        if: ${{ !cancelled() && steps.maestro-upload-internal-binary.outcome == 'success' }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: serp_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ steps.maestro-upload-internal-binary.outputs.maestro_app_binary_id }}
          maestro_api_level: 34
          maestro_include_tags: serpFlows
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: SERP Flows
