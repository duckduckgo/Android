name: Release Blocking Checks

on:
  workflow_call:
    inputs:
      commit:
        description: 'Commit SHA to check out and test'
        required: true
        type: string
      create_asana_tasks:
        description: 'Create Asana failure tasks / release blockers on failure (set false for hotfix verification)'
        required: false
        type: boolean
        default: true
      fail_fast:
        description: 'Cancel the remaining end-to-end suites as soon as one fails'
        required: false
        type: boolean
        default: false
      maestro_priority:
        description: 'Maestro Cloud queue priority for E2E tests (high, normal or low)'
        required: false
        type: string
        default: normal
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to check out and test'
        required: true
        type: string
      create_asana_tasks:
        description: 'Create Asana failure tasks / release blockers on failure'
        required: false
        type: boolean
        default: true
      maestro_priority:
        description: 'Maestro Cloud queue priority for E2E tests'
        required: false
        type: choice
        options:
          - high
          - normal
          - low
        default: normal

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}-${{ inputs.commit }}
  cancel-in-progress: true

jobs:
  nightly:
    uses: ./.github/workflows/nightly.yml
    with:
      commit: ${{ inputs.commit }}
    secrets: inherit

  end-to-end-build:
    uses: ./.github/workflows/e2e-build-and-upload.yml
    with:
      commit: ${{ inputs.commit }}
      create_asana_tasks: ${{ inputs.create_asana_tasks }}
    secrets: inherit

  end-to-end:
    needs: [nightly, end-to-end-build]
    uses: ./.github/workflows/e2e-nightly-full-suite.yml
    with:
      commit: ${{ inputs.commit }}
      create_asana_tasks: ${{ inputs.create_asana_tasks }}
      internal_binary_id: ${{ needs.end-to-end-build.outputs.internal_binary_id }}
      release_binary_id: ${{ needs.end-to-end-build.outputs.release_binary_id }}
      fail_fast: ${{ inputs.fail_fast == true }}
      maestro_priority: ${{ inputs.maestro_priority }}
    secrets: inherit

  privacy:
    needs: nightly
    uses: ./.github/workflows/privacy.yml
    with:
      commit: ${{ inputs.commit }}
    secrets: inherit
