name: 'End to End Tests - Full Suite (Nightly)'

on:
  workflow_call:
    inputs:
      commit:
        description: 'Specific commit SHA to checkout (optional, defaults to latest)'
        required: true
        type: string
      create_asana_tasks:
        description: 'Whether to create Asana tasks on failure (set to false for PR checks)'
        required: false
        type: boolean
        default: true
      internal_binary_id:
        description: 'Maestro Cloud binary ID of an already uploaded Internal APK (builds and uploads one when empty)'
        required: false
        type: string
        default: ''
      release_binary_id:
        description: 'Maestro Cloud binary ID of an already uploaded Play release APK (builds and uploads one when empty)'
        required: false
        type: string
        default: ''
      fail_fast:
        description: 'Cancel the remaining suites as soon as one fails'
        required: false
        type: boolean
        default: false
      maestro_priority:
        description: 'Maestro Cloud queue priority (high, normal or low)'
        required: false
        type: string
        default: normal
  workflow_dispatch:
    inputs:
      commit:
        description: 'Specific commit SHA to checkout (optional, defaults to latest)'
        required: false
        type: string
      create_asana_tasks:
        description: 'Whether to create Asana tasks on failure (set to false for PR checks)'
        required: false
        type: boolean
        default: true
      maestro_priority:
        description: 'Maestro Cloud queue priority'
        required: false
        type: choice
        options:
          - high
          - normal
          - low
        default: normal

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}-e2e-full-suite
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.internal_binary_id == '' || inputs.release_binary_id == '' }}
    uses: ./.github/workflows/e2e-build-and-upload.yml
    with:
      commit: ${{ inputs.commit }}
      create_asana_tasks: ${{ inputs.create_asana_tasks }}
    secrets: inherit

  instrumentation_tests:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: ${{ inputs.fail_fast == true }}
      matrix:
        include:
          - name: Autofill Critical Path
            test-name: autofillCriticalPath
            binary: release
            api-level: 34
            include-tags: autofillNoAuthTests
            suite-name: Autofill Critical Path (Nightly)
          - name: Custom tabs flows
            test-name: customTabs
            binary: internal
            api-level: 34
            include-tags: customTabsTest
            suite-name: Custom Tabs
          - name: Internal Privacy Tests
            test-name: internalPrivacyTest
            binary: internal
            api-level: 34
            include-tags: privacyTestInternal
            suite-name: Internal Privacy (Nightly)
          - name: Onboarding flows
            test-name: onboardingTest
            binary: release
            api-level: 34
            include-tags: onboardingTest
            suite-name: Onboarding (Nightly)
          - name: Internal Onboarding Flows
            test-name: internalonboarding
            binary: internal
            api-level: 36
            include-tags: onboardingInternalTest
            suite-name: Internal Onboarding (Nightly)
          - name: Deeplink tests
            test-name: navigationTest
            binary: release
            api-level: 34
            include-tags: navigationTest
            suite-name: Deeplink (Nightly)
          - name: Ad click detection flows
            test-name: adClickTest
            binary: release
            api-level: 30
            include-tags: adClickTest
            suite-name: Ad Click (Nightly)
          - name: Privacy Tests
            test-name: privacyTest
            binary: release
            api-level: 34
            include-tags: privacyTest
            suite-name: Privacy (Nightly)
          - name: Security Tests
            test-name: securityTest
            binary: release
            api-level: 34
            include-tags: securityTest
            suite-name: Security (Nightly)
          - name: Release Tests
            test-name: releaseTest
            binary: release
            api-level: 34
            include-tags: releaseTest
            suite-name: Release Tests (Nightly)
          - name: Unified Input Field
            test-name: unifiedInputTest
            binary: internal
            api-level: 34
            include-tags: unifiedInputTest
            suite-name: Unified Input Field (Nightly)
          - name: Notifications permissions Android 13+
            test-name: notificationPermissionTest
            binary: release
            api-level: 34
            include-tags: permissionsTest
            suite-name: Notification Permissions (Nightly)
    env:
      INTERNAL_BINARY_ID: ${{ needs.build.outputs.internal_binary_id || inputs.internal_binary_id }}
      RELEASE_BINARY_ID: ${{ needs.build.outputs.release_binary_id || inputs.release_binary_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ${{ matrix.name }}
        id: maestro-suite
        uses: ./.github/actions/maestro-cloud-asana-reporter
        # The suites queue for the same Maestro Cloud devices, so this includes the wait for a free device.
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: ${{ matrix.test-name }}_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ matrix.binary == 'internal' && env.INTERNAL_BINARY_ID || env.RELEASE_BINARY_ID }}
          maestro_api_level: ${{ matrix.api-level }}
          maestro_include_tags: ${{ matrix.include-tags }}
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: ${{ matrix.suite-name }}
          maestro_priority: ${{ inputs.maestro_priority }}
          create_asana_error_task: ${{ inputs.create_asana_tasks }}
          is_release_blocker: true
          asana_releases_project_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_ID }}
          asana_releases_blocker_section_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_BLOCKER_SECTION_ID }}

  report_failure:
    needs: instrumentation_tests
    # One task for the whole run rather than one per failed suite.
    if: ${{ always() && needs.instrumentation_tests.result == 'failure' && inputs.create_asana_tasks == true && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: Report failure

    steps:
      - name: Create Asana task when workflow failed
        id: create-failure-task
        uses: duckduckgo/native-github-asana-sync@v2.8.0
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-project: ${{ secrets.GH_ASANA_AOR_PROJECT_ID }}
          asana-section: ${{ secrets.GH_ASANA_INCOMING_ID }}
          asana-task-name: GH Workflow Failure - End to End tests (Release Blockers)
          asana-task-description: The end to end workflow has failed. See https://github.com/duckduckgo/Android/actions/runs/${{ github.run_id }}
          action: 'create-asana-task'
