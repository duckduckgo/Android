name: 'End to End Tests - Full Suite (Nightly)'

on:
  workflow_call:
    inputs:
      commit:
        description: 'Specific commit SHA to checkout (optional, defaults to latest)'
        required: true
        type: string
      create_asana_tasks:
        description: 'Whether to create Asana tasks on failure (set to false for PR checks)'
        required: false
        type: boolean
        default: true
      internal_binary_id:
        description: 'Maestro Cloud binary ID of an already uploaded Internal APK (builds and uploads one when empty)'
        required: false
        type: string
        default: ''
      release_binary_id:
        description: 'Maestro Cloud binary ID of an already uploaded Play release APK (builds and uploads one when empty)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      commit:
        description: 'Specific commit SHA to checkout (optional, defaults to latest)'
        required: false
        type: string
      create_asana_tasks:
        description: 'Whether to create Asana tasks on failure (set to false for PR checks)'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.internal_binary_id == '' || inputs.release_binary_id == '' }}
    uses: ./.github/workflows/e2e-build-and-upload.yml
    with:
      commit: ${{ inputs.commit }}
      create_asana_tasks: ${{ inputs.create_asana_tasks }}
    secrets: inherit

  instrumentation_tests:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    name: End-to-End tests
    env:
      INTERNAL_BINARY_ID: ${{ needs.build.outputs.internal_binary_id || inputs.internal_binary_id }}
      RELEASE_BINARY_ID: ${{ needs.build.outputs.release_binary_id || inputs.release_binary_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Autofill Critical Path
        id: maestro-autofill-critical
        # Run regardless of earlier suite failures.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: autofillCriticalPath_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ env.RELEASE_BINARY_ID }}
          maestro_api_level: 34
          maestro_include_tags: autofillNoAuthTests
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Autofill Critical Path (Nightly)
          create_asana_error_task: ${{ inputs.create_asana_tasks }}
          is_release_blocker: true
          asana_releases_project_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_ID }}
          asana_releases_blocker_section_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_BLOCKER_SECTION_ID }}

      - name: Custom tabs flows
        id: maestro-custom-tabs
        # Run regardless of earlier suite failures.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
          maestro_api_key: ${{ secrets.ROBIN_API_KEY }}
          maestro_project_id: ${{ vars.ROBIN_ANDROID_PROJECT_ID }}
          maestro_test_name: customTabs_${{ github.sha }}
          maestro_timeout: ${{ vars.ROBIN_TIMEOUT_MINUTES }}
          maestro_app_binary_id: ${{ env.INTERNAL_BINARY_ID }}
          maestro_api_level: 34
          maestro_include_tags: customTabsTest
          asana_pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana_project_id: ${{ vars.GH_ANDROID_APP_PROJECT_ID }}
          asana_section_id: ${{ vars.GH_ANDROID_APP_INCOMING_SECTION_ID }}
          test_suite_name: Custom Tabs
          create_asana_error_task: ${{ inputs.create_asana_tasks }}
          is_release_blocker: true
          asana_releases_project_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_ID }}
          asana_releases_blocker_section_id: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_BLOCKER_SECTION_ID }}

      - name: Internal Privacy Tests
        id: maestro-internal-privacy
        # Run regardless of earlier suite failures.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/maestro-cloud-asana-reporter
        timeout-minutes: 120
        with:
