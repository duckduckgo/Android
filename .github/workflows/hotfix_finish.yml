name: Hotfix - Finish (merge and tag)

on:
  workflow_call:
    inputs:
      app-version:
        description: 'Hotfix version to release (e.g. 5.284.1)'
        required: true
        type: string
      create_asana_task:
        description: 'Create an Asana failure task on failure (set false when a caller handles failure reporting)'
        required: false
        type: boolean
        default: true
    outputs:
      merge-conflict:
        description: "'true' when merging the hotfix branch back stopped on a conflict"
        value: ${{ jobs.hotfix-finish.outputs.merge-conflict }}
  workflow_dispatch:
    inputs:
      app-version:
        description: 'Hotfix version to release (e.g. 5.284.1)'
        required: true
        type: string
      create_asana_task:
        description: 'Create an Asana failure task on failure (set false when a caller handles failure reporting)'
        required: false
        type: boolean
        default: true

env:
  ASANA_PAT: ${{ secrets.ASANA_ACCESS_TOKEN }}
  GH_TOKEN: ${{ secrets.GT_DAXMOBILE }}
  HOTFIX_CONFLICT_PLAYBOOK_URL: https://app.asana.com/1/137249556945/task/1219472906247295

jobs:
  hotfix-finish:
    name: Finish hotfix (merge to main and develop, tag)
    runs-on: ubuntu-latest
    outputs:
      merge-conflict: ${{ steps.detect-merge-conflict.outputs.conflict }}
    env:
      GIT_MERGE_AUTOEDIT: no

    steps:
      # Submodules are intentionally not checked out: this job only does git plumbing
      # (merge to main/develop, tag, push) and never reads submodule contents.
      # Populating them would leave the tree dirty when the lane switches branches
      # (which can record different submodule commits), breaking the merge/tag.
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/${{ inputs.app-version }}
          token: ${{ secrets.GT_DAXMOBILE }}
          fetch-depth: 0

      - name: Set up git config
        run: |
          git remote set-url origin https://${{ secrets.GT_DAXMOBILE }}@github.com/duckduckgo/Android.git/
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Fail if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.app-version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.app-version }} already exists. Aborting hotfix."
            exit 1
          fi

      - name: Set up git-flow
        run: |
          sudo apt-get update
          sudo apt-get install -y git-flow
          git config gitflow.branch.master main
          git config gitflow.branch.develop ${{ github.event.repository.default_branch }}
          git config gitflow.prefix.feature feature/
          git config gitflow.prefix.release release/
          git config gitflow.prefix.hotfix hotfix/
          git config gitflow.prefix.support support/
          git config gitflow.prefix.versiontag ""

      - name: Set up ruby env
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.2
          bundler-cache: true

      - name: Finish hotfix (merge to main and develop, tag, push)
        id: finish
        run: |
          bundle exec fastlane hotfix-finish

      # git flow leaves the conflicted merge in progress, so MERGE_HEAD tells a conflict apart from other lane failures.
      - name: Detect merge conflict
        id: detect-merge-conflict
        if: ${{ failure() && steps.finish.outcome == 'failure' }}
        run: |
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "### Merging the hotfix into $(git branch --show-current) stopped on a conflict" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was pushed. Follow Where to start > Finish failed, keeping version ${{ inputs.app-version }}: $HOTFIX_CONFLICT_PLAYBOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create Asana task when workflow failed
        if: ${{ failure() && inputs.create_asana_task == true }}
        uses: duckduckgo/native-github-asana-sync@v2.7.1
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-project: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_ID }}
          asana-section: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_BLOCKER_SECTION_ID }}
          asana-task-name: GH Workflow Failure - Finish Hotfix
          asana-task-description: |
            The Finish Hotfix workflow has failed. See https://github.com/duckduckgo/Android/actions/runs/${{ github.run_id }}
            ${{ steps.detect-merge-conflict.outputs.conflict == 'true' && format('Merging the hotfix back stopped on a conflict. Follow Where to start > Finish failed, keeping the same version: {0}', env.HOTFIX_CONFLICT_PLAYBOOK_URL) || '' }}
          action: 'create-asana-task'
