name: 'Pull Request opened -> Comment on task and add it to Android Release Board'

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  # `process-internal-pr` is a required status check, so it has to report on the merge queue's
  # temporary branch too. There is no pull request context there, so every step below no-ops and
  # the job reports success without repeating the Asana bookkeeping.
  merge_group:

jobs:
  process-internal-pr:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # A stacked PR is retargeted to the default branch when its parent merges, which fires an
      # `edited` event and lands it on the board then. That retarget can arrive after the PR has
      # merged, so ignore closed PRs or this moves the task back out of Waiting for release.
      - name: Find Asana Task ID
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
        id: find-asana-task
        uses: duckduckgo/native-github-asana-sync@v2.6.0
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          trigger-phrase: ${{ vars.ASANA_TASK_TRIGGER_PHRASE }}
          action: 'find-asana-task-id'

      - name: Add comment with PR link in Asana task
        continue-on-error: true
        if: ${{ github.actor == github.event.pull_request.user.login && ( github.event.action == 'opened' || github.event.action == 'reopened') }}
        uses: duckduckgo/native-github-asana-sync@v2.6.0
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          trigger-phrase: ${{ vars.ASANA_TASK_TRIGGER_PHRASE }}
          action: 'add-asana-comment'
          is-pinned: true

      - name: Add task to Asana project section
        if: ${{ steps.find-asana-task.outcome == 'success' && steps.find-asana-task.outputs.asanaTaskId != '' }}
        uses: duckduckgo/native-github-asana-sync@v2.6.0
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-project: ${{ vars.GH_ANDROID_RELEASE_BOARD_PROJECT_ID }}
          asana-section: ${{ vars.GH_ANDROID_RELEASE_BOARD_PR_SECTION_ID }}
          asana-task-id: ${{ steps.find-asana-task.outputs.asanaTaskId }}
          action: 'add-task-asana-project'
