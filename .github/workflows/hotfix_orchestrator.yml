name: Hotfix - Orchestrate (prepare, verify, finish)

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: 'Hotfix version to release (e.g. 5.284.1)'
        required: true
        type: string
      commit-hashes:
        description: 'Commit SHA(s) to cherry-pick into the hotfix (space- or comma-separated)'
        required: true
        type: string
      release-notes:
        description: 'Release notes for the Play Store listing'
        required: false
        default: 'Bug fixes and other improvements'
        type: string

env:
  HOTFIX_CONFLICT_PLAYBOOK_URL: https://app.asana.com/1/137249556945/task/1219472906247295

jobs:
  prepare:
    uses: ./.github/workflows/hotfix_prepare.yml
    with:
      app-version: ${{ inputs.app-version }}
      commit-hashes: ${{ inputs.commit-hashes }}
      release-notes: ${{ inputs.release-notes }}
      create_asana_task: false
    secrets: inherit

  # Create the Asana hotfix tracking task up-front; mirrors the manual "task first, then tag" order
  create-hotfix-task:
    needs: prepare
    uses: ./.github/workflows/hotfix_create_task.yml
    with:
      app-version: ${{ inputs.app-version }}
      commit-hashes: ${{ inputs.commit-hashes }}
      create_asana_task: false
    secrets: inherit

  resolve-hotfix-sha:
    name: Resolve hotfix branch HEAD SHA
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/${{ inputs.app-version }}
          token: ${{ secrets.GT_DAXMOBILE }}
          fetch-depth: 1
      - name: Resolve SHA
        id: resolve
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release-blocking-checks:
    needs: resolve-hotfix-sha
    uses: ./.github/workflows/release_blocking_checks.yml
    with:
      commit: ${{ needs.resolve-hotfix-sha.outputs.commit_sha }}
      create_asana_tasks: false
    secrets: inherit

  finish:
    needs: release-blocking-checks
    uses: ./.github/workflows/hotfix_finish.yml
    with:
      app-version: ${{ inputs.app-version }}
      create_asana_task: false
    secrets: inherit

  notify-failure:
    needs: [prepare, create-hotfix-task, resolve-hotfix-sha, release-blocking-checks, finish]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Asana task when any orchestrator step failed
        uses: duckduckgo/native-github-asana-sync@v2.7.1
        with:
          asana-pat: ${{ secrets.ASANA_ACCESS_TOKEN }}
          asana-project: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_ID }}
          asana-section: ${{ vars.GH_ANDROID_APP_RELEASES_PROJECT_BLOCKER_SECTION_ID }}
          asana-task-name: GH Workflow Failure - Hotfix Orchestrator ${{ inputs.app-version }}
          asana-task-description: |
            The Hotfix Orchestrator workflow has failed. See https://github.com/duckduckgo/Android/actions/runs/${{ github.run_id }}
            ${{ needs.prepare.outputs.cherry-pick-conflict == 'true' && format('A fix commit did not cherry-pick cleanly. Follow Where to start > Prepare failed, keeping version {0}: {1}', inputs.app-version, env.HOTFIX_CONFLICT_PLAYBOOK_URL) || '' }}
            ${{ needs.finish.outputs.merge-conflict == 'true' && format('Merging the hotfix back stopped on a conflict. Follow Where to start > Finish failed, keeping version {0}: {1}', inputs.app-version, env.HOTFIX_CONFLICT_PLAYBOOK_URL) || '' }}
          action: 'create-asana-task'
