name: 'Checkout code and assemble build flavour'
description: 'Checks out the repository and assembles the Play and Internal release APKs'

inputs:
  commit:
    description: 'Specific ref or commit SHA to checkout (optional, defaults to github.sha)'
    required: false
    default: ''
  flavours:
    description: 'The flavours to assemble (play, internal, all)'
    required: false
    default: 'all'
  release_properties:
    description: 'Release properties secret'
    required: true
  release_key:
    description: 'Release key secret'
    required: true
  gradle_encryption_key:
    description: 'Gradle encryption key secret'
    required: true
  gradle_flags:
    description: 'Additional flags to pass to the gradlew command'
    required: false
    default: ''
  source_patches:
    description: >
      Newline-separated Git patch files applied to the checkout before assembling, for E2E test
      builds that need a compile-time change. A patch that does not apply fails the build. Never
      combine with -PuseUploadSigning in gradle_flags — enforced below.
    required: false
    default: ''
  develocity_access_key:
    description: 'Develocity access key for Gradle remote caching'
    required: false
    default: ''
  ducksans_package_auth_user:
    description: 'GitHub username for DuckSans font package authentication'
    required: false
    default: ''
  ducksans_package_auth_token:
    description: 'GitHub token for DuckSans font package authentication'
    required: false
    default: ''

outputs:
  play_apk_path:
    description: 'Absolute path to Play flavour apk'
    value: ${{ github.workspace }}/apk/release.apk
  internal_apk_path:
    description: 'Absolute path to Internal flavour apk'
    value: ${{ github.workspace }}/apk/internal.apk

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit }}
        submodules: recursive

    - name: Refuse source patches on a signed shipping build
      # A patched compile-time default must never reach a build signed for real distribution.
      if: ${{ inputs.source_patches != '' }}
      shell: bash
      env:
        GRADLE_FLAGS: ${{ inputs.gradle_flags }}
      run: |
        set -euo pipefail
        if [[ "$GRADLE_FLAGS" == *"useUploadSigning"* ]]; then
          echo "::error::source_patches is set together with -PuseUploadSigning. source_patches changes a compile-time default and must never be applied to a build signed for real distribution."
          exit 1
        fi

    - name: Apply source patches
      if: ${{ inputs.source_patches != '' }}
      shell: bash
      env:
        SOURCE_PATCHES: ${{ inputs.source_patches }}
      run: |
        set -euo pipefail
        while IFS= read -r patch; do
          if [ -z "$patch" ]; then continue; fi
          if [ ! -f "$patch" ]; then
            echo "::error::Source patch not found: $patch"
            exit 1
          fi
          if ! git apply --check "$patch"; then
            echo "::error file=$patch::Source patch does not apply. The code it targets changed — update the patch, or delete it if the behaviour it covers has been retired."
            exit 1
          fi
          git apply "$patch"
          echo "Applied source patch: $patch"
        done <<< "$SOURCE_PATCHES"

    - name: Set up JDK version
      uses: actions/setup-java@v4
      with:
        java-version-file: .github/.java-version
        distribution: 'adopt'

    - name: Create folder
      shell: bash
      run: mkdir -p apk

    - name: Decode keys
      uses: davidSchuppa/base64Secret-toFile-action@v2
      with:
        secret: ${{ inputs.release_properties }}
        fileName: ddg_android_build.properties
        destination-path: $HOME/jenkins_static/com.duckduckgo.mobile.android/

    - name: Decode key file
      uses: davidSchuppa/base64Secret-toFile-action@v2
      with:
        secret: ${{ inputs.release_key }}
        fileName: android
        destination-path: $HOME/jenkins_static/com.duckduckgo.mobile.android/

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ inputs.gradle_encryption_key }}
        # Two Gradle builds run per job: cleanup evicts the deps the play build never touched,
        # then the internal build reuses its config cache and fails instead of re-downloading them.
        cache-cleanup: never

    - name: Assemble release APK
      if: ${{ inputs.flavours == 'all' || inputs.flavours == 'play' }}
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.develocity_access_key }}
        DUCKSANS_PACKAGE_AUTH_USER: ${{ inputs.ducksans_package_auth_user }}
        DUCKSANS_PACKAGE_AUTH_TOKEN: ${{ inputs.ducksans_package_auth_token }}
      run: ./gradlew assemblePlayRelease -Pforce-default-variant -Pskip-onboarding -x lint ${{ inputs.gradle_flags }}

    - name: Move Play APK
      if: ${{ inputs.flavours == 'all' || inputs.flavours == 'play' }}
      shell: bash
      run: find . -name "*play-release*.apk" -exec mv '{}' apk/release.apk \;

    - name: Assemble internal release APK
      if: ${{ inputs.flavours == 'all' || inputs.flavours == 'internal' }}
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.develocity_access_key }}
        DUCKSANS_PACKAGE_AUTH_USER: ${{ inputs.ducksans_package_auth_user }}
        DUCKSANS_PACKAGE_AUTH_TOKEN: ${{ inputs.ducksans_package_auth_token }}
      run: ./gradlew assembleInternalRelease -Pforce-default-variant -Pskip-onboarding -x lint ${{ inputs.gradle_flags }}

    - name: Move Internal APK
      if: ${{ inputs.flavours == 'all' || inputs.flavours == 'internal' }}
      shell: bash
      run: find . -name "*internal-release*.apk" -exec mv '{}' apk/internal.apk \;
