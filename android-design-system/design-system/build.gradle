import com.android.build.api.variant.HostTestBuilder
import com.android.build.api.variant.TestSuiteSourceSet

plugins {
    id 'com.android.library'
    id 'dev.zacsweers.metro'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'io.github.takahirom.roborazzi'
    id 'app.cash.paparazzi'
}

apply from: "$rootProject.projectDir/gradle/android-library.gradle"

android {
    namespace 'com.duckduckgo.mobile.android'
}

android {
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    experimentalProperties["android.experimental.testSuiteSupport"] = true
    lintOptions {
        baseline file("lint-baseline.xml")
        abortOnError = !project.hasProperty("abortOnError") || project.property("abortOnError") != "false"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        screenshotTests.create("screenshotTest") {
            engineVersion = "0.0.1-alpha17"
            targetVariants.add("debug")
            dependencies {
                implementation(project.dependencies.platform(AndroidX.compose.bom))
                implementation(AndroidX.compose.ui.tooling)
                implementation("com.android.tools.screenshot:screenshot-validation-api:0.0.1-alpha17")
            }
        }
    }

    buildFeatures {
        compose true
    }

    // The screenshot catalog is shared by the Roborazzi and Paparazzi tests (unit tests) and the Compose Preview Screenshot tests,
    // which get it through the test suite sources below.
    sourceSets {
        test.java.srcDir("src/screenshotCatalog/java")
        test.kotlin.srcDir("src/screenshotCatalog/java")
    }
}

dependencies {
    ksp project(':codegen-ksp')

    if (rootProject.ext.proprietaryFontAvailable) {
        api "com.duckduckgo:ddg-proprietary-fonts:1.0.2"
    } else {
        api project(':fonts')
    }

    implementation project(path: ':common-utils')

    implementation project(path: ':di')
    implementation project(path: ':codegen-annotations')
    implementation project(path: ':app-build-config-api')
    implementation project(':internal-features-api')
    implementation project(':feature-toggles-api')
    implementation "androidx.datastore:datastore-preferences:_"

    implementation AndroidX.appCompat
    implementation Google.android.material
    implementation AndroidX.constraintLayout
    implementation AndroidX.core.splashscreen
    implementation AndroidX.fragment.ktx
    implementation AndroidX.recyclerView
    implementation AndroidX.lifecycle.viewModelKtx

    implementation "androidx.core:core-ktx:_"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:_"

    implementation "com.github.bumptech.glide:glide:_"

    implementation "com.google.android.flexbox:flexbox:_"

    api(platform("io.coil-kt.coil3:coil-bom:_"))
    api("io.coil-kt.coil3:coil-compose")
    api("io.coil-kt.coil3:coil-network-okhttp")

    // Compose
    api(platform(AndroidX.compose.bom))
    api(AndroidX.compose.foundation)
    api(AndroidX.compose.foundation.layout)
    api(AndroidX.compose.material3)
    api(AndroidX.compose.runtime)
    api(AndroidX.compose.ui)
    api(AndroidX.compose.ui.tooling)

    api("org.jetbrains.kotlinx:kotlinx-collections-immutable:_")

    lintChecks("com.slack.lint.compose:compose-lint-checks:_")

    // Lottie
    implementation "com.airbnb.android:lottie:_"

    // Testing dependencies
    testImplementation "org.mockito.kotlin:mockito-kotlin:_"
    testImplementation project(':feature-toggles-test')
    implementation Testing.junit4
    testImplementation AndroidX.test.ext.junit
    testImplementation AndroidX.archCore.testing
    testImplementation 'app.cash.turbine:turbine:_'
    testImplementation Testing.robolectric
    testImplementation project(path: ':common-test')

    // Screenshot testing
    testImplementation "io.github.takahirom.roborazzi:roborazzi:_"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:_"
    testImplementation AndroidX.compose.ui.testJunit4
    testImplementation AndroidX.compose.ui.testManifest
    testImplementation AndroidX.activity.compose
}

roborazzi {
    outputDir.set(file("src/test/screenshots"))
}

// Robolectric and Paparazzi's layoutlib each load a native Android runtime, and only one can be registered per JVM.
tasks.withType(Test).configureEach {
    forkEvery = 1
}

// Screenshot tests run through the AGP test suite above, so the legacy per-variant screenshot host test is turned off to avoid
// duplicate task names. Release keeps unit tests because AGP's generate<Variant>ComposePreviewRunfiles requires one per Compose variant.
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.hostTests[HostTestBuilder.SCREENSHOT_TEST_TYPE]?.enable = false
    }
    beforeVariants(selector().withBuildType("release")) { variantBuilder ->
        variantBuilder.hostTests[HostTestBuilder.UNIT_TEST_TYPE]?.enable = true
    }
    onVariants(selector().all()) { variant ->
        variant.suites.values().each { suite ->
            suite.sources.findAll { it instanceof TestSuiteSourceSet.HostJar }.each { hostJar ->
                hostJar.kotlin.addStaticSourceDirectory(file("src/screenshotCatalog/java").absolutePath)
            }
        }
    }
}

