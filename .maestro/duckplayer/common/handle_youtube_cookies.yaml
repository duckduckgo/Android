appId: com.duckduckgo.mobile.android
---
- extendedWaitUntil:
    notVisible:
      id: pageLoadingIndicator
    timeout: 5000
    optional: true
# Handle YouTube cookies consent dialog if visible
- runFlow:
    when:
      visible: "Before you continue to YouTube"
    commands:
      - scrollUntilVisible:
          element:
            text: "More options"
            optional: true
          direction: DOWN

      - tapOn:
          text: "Reject.*"
          optional: true

# Handle YouTube "Get the best experience" app promo dialog if visible
- extendedWaitUntil:
    visible: "Get the best experience"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: "Get the best experience"
    commands:
      - tapOn:
          text: "Close"
      - extendedWaitUntil:
          notVisible: "Get the best experience"
          timeout: 3000
