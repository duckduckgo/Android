appId: com.duckduckgo.mobile.android
name: "DuckPlayer: Open Duck Player Settings"
tags:
  - duckplayer
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState
      - openLink:
          link: "duck://https://duckduckgo.com"

      - runFlow: ../shared/browser_screen/click_on_menu_button.yaml

      - scrollUntilVisible:
          element:
            id: "com.duckduckgo.mobile.android:id/settingsMenuItem"
          direction: DOWN

      - tapOn:
          id: "com.duckduckgo.mobile.android:id/settingsMenuItem"

      - scrollUntilVisible:
          element:
            text: "Duck Player"
          direction: DOWN

      - tapOn:
          text: "Duck Player"

      - assertVisible:
          text: "Open YouTube Videos in Duck Player"