appId: com.duckduckgo.mobile.android
name: "DuckPlayer: Direct > Duck Player > Playback"
tags:
  - duckplayerlocal
---
- retry:
    maxRetries: 3
    commands:
      - clearState

      - openLink:
          link: "duck://player/3ml7yeKBUhc"

      - extendedWaitUntil:
          visible:
            text: "duck://player/3ml7yeKBUhc"
          timeout: 5000

      - tapOn:
          id: player-control-overlay

      - assertVisible: "Pause video"
