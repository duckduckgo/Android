appId: com.duckduckgo.mobile.android
name: "DuckPlayer: Ask > SERP > Organic > Duck Player"
tags:
  - duckplayer
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState
      - runFlow: common/enable_duck_player_ask.yaml
      - runFlow: common/load_serp_videos_organic.yaml
      - runFlow: common/serp_dialog_duckplayer.yaml
      - runFlow: common/assert_duckplayer_visible.yaml