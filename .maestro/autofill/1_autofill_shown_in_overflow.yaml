appId: com.duckduckgo.mobile.android
name: "ReleaseTest: Autofill screen is reachable from overflow menu"
tags:
    - releaseTest
---
# Pre-requisite: None (can be run whether auth is required or not)

- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState
      - openLink:
          link: "duck://https://duckduckgo.com"
      - runFlow: steps/access_passwords_screen.yaml