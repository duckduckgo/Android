appId: com.duckduckgo.mobile.android
name: "Segment Skip: Ask to Skip shows Skip and skips on tap"
tags:
  - segmentSkip
---
# Requires an internal release build with remote_config_patches/segment_skip_enabled_patch.json.
# Ask to Skip is the default mode, so the flow doesn't change it.
# The button hides itself after 8s of playback, and with a playing video every Maestro step waits
# for a settle that never comes, so it is tapped as soon as it shows.
- runFlow: steps/start_app.yaml
- runFlow: steps/open_video.yaml
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
- tapOn:
    text: "Skip"
    waitToSettleTimeoutMs: 500
# Tapping hides the button immediately; left alone it hides after 8s of playback,
# so disappearing within 2s of the tap is what proves the skip ran.
- extendedWaitUntil:
    notVisible: "Skip"
    timeout: 2000
# Only an automatic skip offers to undo.
- runFlow: steps/expect_no_button.yaml
