appId: com.duckduckgo.mobile.android
name: "Segment Skip: Never plays the segment untouched"
tags:
  - segmentSkip
---
# Requires an internal release build with remote_config_patches/segment_skip_enabled_patch.json.
# Never turns the feature off for the page, so no segment markers, no skip and no button.
- runFlow: steps/start_app.yaml
- runFlow:
    file: steps/set_mode.yaml
    env:
      MODE: "Never"
- runFlow: steps/open_video.yaml
- assertVisible: "Rise of Skanderbeg.*"
# From 44s to past the segment's end at 114s, in 5s slices so a button showing at any point fails the flow.
- repeat:
    times: 16
    commands:
      - runFlow: steps/expect_no_button.yaml
- assertVisible: "Rise of Skanderbeg.*"
