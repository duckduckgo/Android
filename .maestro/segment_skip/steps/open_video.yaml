appId: com.duckduckgo.mobile.android
---
# wHAT_JDwFOY has a single SponsorBlock "sponsor" segment from 48s to 114s; the diagnose step in the
# E2E workflow checks that segment against the live service.
# The first load only gets YouTube's cookie and promo dialogs out of the way, which takes 30s or more
# in CI while the video plays. The second load starts at 44s without them, so playback reaches the
# segment a few seconds later, by playing rather than by the initial seek, with the flow already
# waiting for the button.
- tapOn:
    id: "omnibarTextInput|inputField"
- inputText: "https://m.youtube.com/watch?v=wHAT_JDwFOY"
- pressKey: Enter
- runFlow: ../../duckplayer/common/handle_youtube_cookies.yaml
- tapOn:
    id: "omnibarTextInput|inputField"
- eraseText: 100
- inputText: "https://m.youtube.com/watch?v=wHAT_JDwFOY&t=44"
- pressKey: Enter
