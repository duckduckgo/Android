appId: com.duckduckgo.mobile.android
---
# wHAT_JDwFOY has a single SponsorBlock "sponsor" segment from 48s to 114s; the diagnose step in the
# E2E workflow checks that segment against the live service. Starting at 20s gives page load and the
# cookie and promo dialogs (about 20s in CI) time to finish before playback reaches the segment.
- tapOn:
    id: "omnibarTextInput|inputField"
- inputText: "https://m.youtube.com/watch?v=wHAT_JDwFOY&t=20"
- pressKey: Enter
- runFlow: ../../duckplayer/common/handle_youtube_cookies.yaml
- tapOn:
    text: "No Thanks"
    optional: true
