appId: com.duckduckgo.mobile.android
name: "Segment Skip: Live YouTube player shows Skip Content"
tags:
  - segmentSkip
---
# Requires an internal release build with remote_config_patches/segment_skip_enabled_patch.json.
# Runs through the real onboarding rather than the skip-onboarding seeder, so the sponsor dataset
# download that starts at first launch gets onboarding's duration as a head start.
# wHAT_JDwFOY has a single SponsorBlock "sponsor" segment from 48s to 114s. A segment that starts
# well into the video matters: the button hides itself after 8s of playback, and with a playing
# video every Maestro step waits for a settle that never comes, so a segment at 0s can expire
# before the assertion starts.
- launchApp:
    clearState: true
- runFlow: ../shared/pre_onboarding.yaml
- tapOn:
    id: "contextualBrandDesignDismissButton"
- runFlow: ../shared/dismiss_native_input.yaml
- tapOn:
    id: "omnibarTextInput|inputField"
- inputText: "https://m.youtube.com/watch?v=wHAT_JDwFOY"
- pressKey: Enter
- runFlow: ../duckplayer/common/handle_youtube_cookies.yaml
- tapOn:
    text: "No Thanks"
    optional: true
- extendedWaitUntil:
    visible: "Skip Content"
    timeout: 90000
- tapOn:
    text: "Skip Content"
    waitToSettleTimeoutMs: 500
# Tapping hides the button immediately; left alone it hides after 8s of playback,
# so disappearing within 2s of the tap is what proves the skip ran.
- extendedWaitUntil:
    notVisible: "Skip Content"
    timeout: 2000
