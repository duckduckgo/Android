appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
    - securityTest
---
- retry:
      maxRetries: 3
      commands:
            # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
            - launchApp
            - clearState
            # Test 1
            - openLink:
                link: "duck://https://privacy-test-pages.site/security/address-bar-spoofing/spoof-form-action.html"

            - tapOn: "run"
            # Should do nothing - the navigation should be prevented.
            - tapOn:
                id: "omnibarTextInput|inputField"
            - copyTextFrom:
                id: "omnibarTextInput|inputField"
            - assertTrue: ${maestro.copiedText == "https://privacy-test-pages.site/security/address-bar-spoofing/spoof-form-action.html"}
