appId: com.duckduckgo.mobile.android
name: "Onboarding: Ensuring we can navigate through pre-onboarding flow"
tags:
    - onboardingTest
---
# Pre-requisite: None

- retry:
    maxRetries: 3
    commands:
      - launchApp:
            clearState: true
            arguments:
              isMaestro: "true"
              featureFlags: "${typeof ONBOARDING_FEATURE_FLAGS === 'undefined' ? '' : ONBOARDING_FEATURE_FLAGS}"
      - runFlow: ../shared/pre_onboarding.yaml