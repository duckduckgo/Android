appId: com.duckduckgo.mobile.android
name: "Navigation Test: Navigate to SERP with duck scheme query"
tags:
  - navigationTest
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState
      - openLink:
          link: duck://https://duckduckgo.com?q=why%20use%20duckduckgo

      # On a cold start the omnibar shows the full URL until the SERP loads and replaces it with the query.
      - extendedWaitUntil:
          visible:
            id: "omnibarTextInput|inputField"
            text: "why use duckduckgo"
          timeout: 10000

      - copyTextFrom:
          id: "omnibarTextInput|inputField"

      - assertTrue: ${maestro.copiedText == "why use duckduckgo" }