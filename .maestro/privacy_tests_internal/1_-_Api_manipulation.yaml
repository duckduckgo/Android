appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
  - privacyTestInternal
---
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          clearState: true
          arguments:
            isMaestro: "true"
            privacyConfigUrl: "https://privacy-test-pages.site/content-scope-scripts/infra/config/conditional-matching-experiments.json"
      - runFlow: ../shared/skip_all_onboarding.yaml
      - openLink: "duck://https://privacy-test-pages.site/content-scope-scripts/infra/pages/conditional-matching-experiments.html?automation=1"
      - tapOn:
          id: "run-tests"
      - assertVisible:
          id: "test-status"
          text: "pass"
