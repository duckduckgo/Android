appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
    - privacyTest
---
- retry:
      maxRetries: 3
      commands:
            - clearState
            - openLink:
                link: "duck://https://privacy-test-pages.site/privacy-protections/query-parameters/"
            - assertVisible:
                text: "Link with fbclid, fb_source and 1 standard parameter"
            - tapOn:
                text: "Link with fbclid, fb_source and 1 standard parameter"
            - assertNotVisible:
                text: "fbclid=12345&fb_source=someting&u=14"
            - assertVisible:
                text: "u=14"
