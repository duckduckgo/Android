appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
    - privacyTest
---
- retry:
      maxRetries: 3
      commands:
            # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
            - launchApp
            - clearState
            - openLink:
                link: "duck://https://privacy-test-pages.site/privacy-protections/query-parameters/"
            - assertVisible:
                text: "Link which should not be rewritten"
            - tapOn:
                text: "Link which should not be rewritten"
            - assertVisible:
                text: "q=something&id=1234"
