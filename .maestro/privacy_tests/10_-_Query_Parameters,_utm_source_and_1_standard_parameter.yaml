appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
    - privacyTest
---
- retry:
      maxRetries: 3
      commands:
            # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
            - launchApp
            - clearState
            - openLink:
                link: "duck://https://privacy-test-pages.site/privacy-protections/query-parameters/"
            - assertVisible:
                text: "Link with utm_source and 1 standard parameter"
            - tapOn:
                text: "Link with utm_source and 1 standard parameter"
            - assertNotVisible:
                text: "utm_source=something&q=other"
            - assertVisible:
                text: "q=other"
