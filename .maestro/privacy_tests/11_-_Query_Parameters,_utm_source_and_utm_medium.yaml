appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
tags:
    - privacyTest
---
- retry:
      maxRetries: 3
      commands:
            - clearState
            - openLink:
                link: "duck://https://privacy-test-pages.site/privacy-protections/query-parameters/"
            - assertVisible:
                text: "Link with utm_source and utm_medium"
            - tapOn:
                text: "Link with utm_source and utm_medium"
            - assertNotVisible:
                text: "utm_source=something&utm_medium=somethingelse"
            - assertVisible:
                text: ""
