appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
name: "Launch Privacy Pro from special URL is working"
tags:
  - pproTest
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState

      - openLink:
          link: "duck://https://duckduckgo.com/pro"
      - assertVisible:
          id: "com.duckduckgo.mobile.android:id/titleToolbar"
          text: "Privacy Pro"
      - assertVisible:
          text: "VPN"
      - assertVisible:
          text: "Personal Information Removal"
      - assertVisible:
          text: "Identity Theft Restoration"
