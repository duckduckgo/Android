appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
name: "ReleaseTest: Can add favorite from bookmark screen"
tags:
  - releaseTest
---
- retry:
    maxRetries: 3
    commands:
      - launchApp:
          clearState: true
          stopApp: true

      - runFlow: ../shared/skip_all_onboarding.yaml

      - tapOn:
          id: "omnibarTextInput|inputField"
      - inputText: "https://privacy-test-pages.site"
      - pressKey: Enter
      # A bookmark keeps the title the page had when it was saved, so let the page finish loading first.
      # The indicator is a native view, so this doesn't depend on reading the WebView's text.
      - extendedWaitUntil:
          visible:
            id: pageLoadingIndicator
          timeout: 5000
          optional: true
      - extendedWaitUntil:
          notVisible:
            id: pageLoadingIndicator
          timeout: 20000
          optional: true
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - tapOn:
          text: "add bookmark"
      # Navigate to bookmarks screen
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - tapOn:
          text: "bookmarks"
      # Add favorite from bookmarks screen
      - tapOn:
          id: "com.duckduckgo.mobile.android:id/trailingIcon"
          index: 0
      - tapOn:
          text: "add to favorites"
      - assertVisible:
          id: "com.duckduckgo.mobile.android:id/favoriteStar"
