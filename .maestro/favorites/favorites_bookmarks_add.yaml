appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
name: "ReleaseTest: Can add favorite from bookmark screen"
tags:
  - releaseTest
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState

      - openLink:
          link: "duck://https://privacy-test-pages.site"
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - tapOn:
          text: "add bookmark"
      # Navigate to bookmarks screen
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - tapOn:
          text: "bookmarks"
      # Add favorite from bookmarks screen
      - tapOn:
          id: "com.duckduckgo.mobile.android:id/trailingIcon"
          index: 0
      - tapOn:
          text: "add to favorites"
      - assertVisible:
          id: "com.duckduckgo.mobile.android:id/favoriteStar"
