appId: com.duckduckgo.mobile.android
---
# Segmented onboarding experiment, "Block ads" path (see NewUserOnboardingPlanProvider.segmentedBlockAdsPlan).
# Entered from pre_onboarding.yaml once the "Set things up your way" download-reason screen is visible;
# inherits SET_AS_DEFAULT from the caller.
- evalScript: ${output.segmentedOnboardingShown = true}
# "Block ads and pop-ups" option; matched by id because the label wraps onto two lines.
- tapOn:
    id: "downloadReasonOptionBlockAds"
- tapOn: "next"
- assertVisible:
    id: "comparisonChartTitle"
- tapOn: "choose your browser"
- runFlow:
    when:
      true: ${SET_AS_DEFAULT == 'true'}
    commands:
      - runFlow:
          when:
            visible: "set as default"
          commands:
            - tapOn: "duckduckgo"
            - tapOn: "set as default"
- runFlow:
    when:
      true: ${SET_AS_DEFAULT != 'true'}
    commands:
      - tapOn: "cancel"
- assertVisible:
    id: "preferenceSelectorTitle"
- tapOn: "next"
- assertVisible:
    id: "widgetPromptTitle"
- tapOn: "Not Now"
- assertVisible:
    id: "inputScreenTitle"
- tapOn: "next"
# The onboarding password import experiment's treatment adds an import step before the address bar step.
# Skipping it is optional so this flow passes whichever cohort a run gets enrolled into.
- extendedWaitUntil:
    visible:
      id: "importPasswordsTitle"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible:
        id: "importPasswordsTitle"
    commands:
      - tapOn:
          id: "secondaryCta"
- assertVisible:
    id: "addressBarTitle"
- tapOn: "next"
- assertVisible:
    id: "suggestion1"
- tapOn:
    id: "suggestion1"
