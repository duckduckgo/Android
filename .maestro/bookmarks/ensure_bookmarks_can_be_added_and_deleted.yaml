appId: com.duckduckgo.mobile.android
androidWebViewHierarchy: devtools
name: "ReleaseTest: Bookmarks can be added and deleted"
tags:
  - releaseTest
---
- retry:
    maxRetries: 3
    commands:
      # Maestro Cloud requires launchApp first; clearState then drops the onboarding it starts.
      - launchApp
      - clearState

      - openLink:
          link: "duck://https://privacy-test-pages.site"
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - assertVisible:
          text: "add bookmark"
      - tapOn:
          text: "add bookmark"
      - tapOn:
          id: 'com.duckduckgo.mobile.android:id/browserMenuImageView'
      - assertVisible:
          text: "bookmarks"
      - tapOn:
          text: "bookmarks"
      - assertVisible:
          text: "Privacy Test Pages - Home"
      - tapOn:
          id: "com.duckduckgo.mobile.android:id/trailingIcon"
      - assertVisible:
          text: "Delete"
      - tapOn:
          text: "delete"
      - assertNotVisible:
          text: "Privacy Test Pages - Home"
      - assertVisible:
          text: "No bookmarks added yet"
